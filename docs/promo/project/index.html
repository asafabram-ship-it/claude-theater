<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
      font-family: "Plex Hebrew";
      src: url("assets/fonts/IBMPlexSansHebrew-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Plex Hebrew";
      src: url("assets/fonts/IBMPlexSansHebrew-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Plex Hebrew";
      src: url("assets/fonts/IBMPlexSansHebrew-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "Plex Hebrew";
      src: url("assets/fonts/IBMPlexSansHebrew-Bold.ttf") format("truetype");
      font-weight: 700 900;
    }
    @font-face {
      font-family: "Frank Ruhl Libre";
      src: url("assets/fonts/FrankRuhlLibre.ttf") format("truetype");
      font-weight: 300 900;
    }
      :root {
        --ground: #f3f8f8;
        --ink: #142430;
        --teal: #31a3ad;
        --teal-deep: #1f7a82;
        --dim: #6e7f86;
        --font-display: "Plex Hebrew";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.5"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="3.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="chat"
        data-composition-id="chat"
        data-composition-src="compositions/chat.html"
        data-start="3.2"
        data-duration="4.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="pane"
        data-composition-id="pane"
        data-composition-src="compositions/pane.html"
        data-start="7.6"
        data-duration="7.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="14.9"
        data-duration="5.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20.5"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1080"
        style="z-index: 10"
      ></div>

      <audio id="narration" class="clip" src="assets/narration.mp3" data-start="0.2" data-track-index="3" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="20.5" data-track-index="4" data-volume="0.16" data-fade-out="1.2"></audio>
      <audio id="done-sound" class="clip" src="assets/done.wav" data-start="11.9" data-duration="0.55" data-track-index="5" data-volume="0.7"></audio>
      <audio id="whoosh-1" class="clip" src="assets/whoosh-1.mp3" data-start="3.1" data-duration="1" data-track-index="6" data-volume="0.45"></audio>
      <audio id="whoosh-2" class="clip" src="assets/whoosh-2.mp3" data-start="7.45" data-duration="1" data-track-index="8" data-volume="0.45"></audio>
      <audio id="click-1" class="clip" src="assets/click.mp3" data-start="12.59" data-duration="1" data-track-index="7" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
